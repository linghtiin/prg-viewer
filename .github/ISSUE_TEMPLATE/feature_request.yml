name: Feature request
description: 建议新功能或更好的渲染方式
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 解析 / 文件格式
        - 画布渲染
        - 交互 / 快捷键
        - 搜索 / 大纲 / 详情
        - 深链 / 外部集成
        - 工程 / CI / 文档
    validations:
      required: true
