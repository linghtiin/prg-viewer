name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm 版本只由 package.json 的 packageManager 决定，
      # 两处同时指定会触发 “Multiple versions of pnpm specified”。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check tag matches manifest version
        run: node --experimental-strip-types scripts/check-version.ts --tag "$GITHUB_REF_NAME"

      - run: pnpm verify
      - run: pnpm inspect fixtures/sample.prg
      - run: pnpm package:release

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            dist/prg-viewer.zip
