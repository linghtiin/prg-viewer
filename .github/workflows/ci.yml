name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不写 version：pnpm 版本只由 package.json 的 packageManager 决定，
      # 两处同时指定会触发 “Multiple versions of pnpm specified”。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm inspect fixtures/sample.prg

      - uses: actions/upload-artifact@v4
        with:
          name: prg-viewer
          path: |
            main.js
            manifest.json
            styles.css
